<!DOCTYPE html>
<html class="light" lang="es">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Mis Vuelos</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/vuelos.css" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  </head>

  <body class="bg-background-light dark:bg-background-dark font-display">
    <div
      class="relative flex h-auto min-h-screen w-full flex-col group/design-root overflow-x-hidden"
    >
      <div class="layout-container flex h-full grow flex-col">
        <div class="px-4 md:px-10 lg:px-40 flex flex-1 justify-center py-5">
          <div
            class="layout-content-container flex flex-col max-w-[960px] flex-1"
          >
            <header
              class="flex items-center justify-between whitespace-nowrap border-b border-solid border-gray-200 dark:border-gray-700 px-4 sm:px-10 py-3"
            >
              <div
                class="flex items-center gap-4 text-text-primary dark:text-white"
              >
                <div class="size-6 text-primary">
                  <span class="material-symbols-outlined !text-3xl"
                    >flight</span
                  >
                </div>
                <h2
                  class="text-text-primary dark:text-white text-xl font-bold leading-tight tracking-[-0.015em]"
                >
                  Mis Vuelos
                </h2>
              </div>
            </header>

            <main class="flex-grow p-4 md:p-6 lg:p-8">
              <div class="flex flex-col gap-6">
                <h1
                  class="text-text-primary dark:text-white text-3xl md:text-4xl font-black leading-tight tracking-[-0.033em]"
                >
                  Mis Vuelos Comprados
                </h1>
                <!-- Contenedor dinámico -->
                <div id="vuelosContainer" class="grid grid-cols-1 gap-4"></div>

                <div
                  id="sinVuelos"
                  class="hidden text-center p-10 border-2 border-dashed border-gray-300 dark:border-gray-600 rounded-xl mt-6"
                >
                  <div class="flex flex-col items-center gap-4">
                    <span
                      class="material-symbols-outlined text-5xl text-text-secondary dark:text-gray-400"
                      >flight_takeoff</span
                    >
                    <p class="text-text-primary dark:text-white font-semibold">
                      No tienes vuelos comprados.
                    </p>
                    <p class="text-text-secondary dark:text-gray-400 max-w-sm">
                      ¿Listo para tu próxima aventura? Encuentra las mejores
                      ofertas y vuela a tu destino soñado.
                    </p>
                    <button
                      class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-10 px-6 bg-primary text-white text-sm font-bold leading-normal tracking-[0.015em] mt-4 hover:bg-primary/90 transition-colors"
                    >
                      <a href="index.html">Buscar un Nuevo Vuelo</a>
                    </button>
                  </div>
                </div>
              </div>
            </main>

            <footer
              class="text-center py-6 border-t border-gray-200 dark:border-gray-700 mt-10"
            >
              <p class="text-text-secondary dark:text-gray-400 text-sm">
                © 2025 Mis Vuelos. Todos los derechos reservados.
              </p>
            </footer>
          </div>
        </div>
      </div>
    </div>
  </body>
  <script src="./js/vuelos.js"></script>
</html>
