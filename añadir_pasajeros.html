<!DOCTYPE html>
<html class="light" lang="es">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Añadir Nuevo Pasajero</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/añadir_pasajeros.css" />
  </head>

  <body class="bg-background-light dark:bg-background-dark font-display">
    <div class="relative flex min-h-screen w-full flex-col items-center justify-center p-4 sm:p-6 lg:p-8">
      <div class="w-full max-w-4xl">
        <div class="bg-white dark:bg-background-dark rounded-xl shadow-lg p-6 sm:p-8 md:p-12">
          <div class="mb-8">
            <h1 class="text-text-dark dark:text-text-light text-3xl sm:text-4xl font-extrabold tracking-tight">
              Añadir Pasajero
            </h1>
            <p class="mt-2 text-secondary dark:text-gray-400 text-base">
              Introduce los datos del pasajero.
            </p>
          </div>

          <form id="passengerForm" class="grid grid-cols-1 gap-x-8 gap-y-6 md:grid-cols-2" novalidate>
            <input type="hidden" id="idAsiento" name="idAsiento" value="0" />
            <input type="hidden" id="passengerId" name="passengerId" value="" />

            <div class="md:col-span-1">
              <label for="nombres" class="block text-sm font-medium leading-6 text-text-dark dark:text-text-light">Nombre</label>
              <div class="mt-2">
                <input id="nombres" name="nombres" required type="text" placeholder="Introduce tu nombre"
                  class="form-input block w-full rounded-lg px-4 py-3" />
              </div>
            </div>

            <div class="md:col-span-1">
              <label for="primerApellido" class="block text-sm font-medium leading-6 text-text-dark dark:text-text-light">Primer Apellido</label>
              <div class="mt-2">
                <input id="primerApellido" name="primerApellido" required type="text" placeholder="Introduce tu primer apellido"
                  class="form-input block w-full rounded-lg px-4 py-3" />
              </div>
            </div>

            <div class="md:col-span-1">
              <label for="segundoApellido" class="block text-sm font-medium leading-6 text-text-dark dark:text-text-light">Segundo Apellido</label>
              <div class="mt-2">
                <input id="segundoApellido" name="segundoApellido" type="text" placeholder="Introduce tu segundo apellido"
                  class="form-input block w-full rounded-lg px-4 py-3" />
              </div>
            </div>

            <div class="md:col-span-1">
              <label for="fechaNacimiento" class="block text-sm font-medium leading-6 text-text-dark dark:text-text-light">Fecha de Nacimiento</label>
              <div class="relative mt-2">
                <input id="fechaNacimiento" name="fechaNacimiento" required type="date"
                  class="form-input block w-full rounded-lg pl-4 pr-10 py-3" />
                <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-3">
                  <span class="material-symbols-outlined text-secondary dark:text-gray-400">calendar_today</span>
                </div>
              </div>
            </div>

            <div class="md:col-span-1">
              <label class="block text-sm font-medium leading-6 text-text-dark dark:text-text-light">Género</label>
              <div class="mt-2 flex gap-3">
                <label class="flex items-center gap-2 cursor-pointer">
                  <input id="generoM" type="radio" name="genero" value="M" required />
                  Hombre
                </label>
                <label class="flex items-center gap-2 cursor-pointer">
                  <input id="generoF" type="radio" name="genero" value="F" />
                  Mujer
                </label>
                <label class="flex items-center gap-2 cursor-pointer">
                  <input id="generoO" type="radio" name="genero" value="O" />
                  Otro
                </label>
              </div>
            </div>

            <div class="md:col-span-1">
              <label for="tipoDocumento" class="block text-sm font-medium leading-6 text-text-dark dark:text-text-light">Tipo de Documento</label>
              <div class="mt-2">
                <select id="tipoDocumento" name="tipoDocumento" required class="form-input block w-full rounded-lg p-3">
                  <option value="">Selecciona tipo de documento</option>
                  <option value="CC">Cédula de Ciudadanía</option>
                  <option value="TI">Tarjeta de Identidad</option>
                  <option value="PP">Pasaporte</option>
                  <option value="CE">Cédula de Extranjería</option>
                </select>
              </div>
            </div>

            <div class="md:col-span-1">
              <label for="numeroDocumento" class="block text-sm font-medium leading-6 text-text-dark dark:text-text-light">Número de Identidad</label>
              <div class="mt-2">
                <input id="numeroDocumento" name="numeroDocumento" required type="text" placeholder="Introduce el número"
                  class="form-input block w-full rounded-lg px-4 py-3" />
              </div>
            </div>

            <div class="md:col-span-1">
              <label for="celular" class="block text-sm font-medium leading-6 text-text-dark dark:text-text-light">Celular</label>
              <div class="mt-2">
                <input id="celular" name="celular" required type="tel" placeholder="Introduce tu número de teléfono"
                  class="form-input block w-full rounded-lg px-4 py-3" />
              </div>
            </div>

            <div class="md:col-span-1">
              <label for="email" class="block text-sm font-medium leading-6 text-text-dark dark:text-text-light">Email</label>
              <div class="mt-2">
                <input id="email" name="email" required type="email" placeholder="Ingrese su email"
                  class="form-input block w-full rounded-lg px-4 py-3" />
              </div>
            </div>

            <div class="md:col-span-1 flex items-center gap-3">
              <input id="infante" name="infante" type="checkbox" />
              <label for="infante" class="text-sm">Infante</label>
            </div>
          </form>

          <div class="mt-10 pt-8 border-t border-gray-200 dark:border-gray-700 flex flex-col sm:flex-row-reverse sm:items-center sm:justify-start gap-4">
            <button id="saveBtn" type="button"
              class="inline-flex justify-center rounded-lg bg-primary px-6 py-3 text-sm font-semibold text-white shadow-sm hover:bg-blue-700 transition-colors duration-200">
              Guardar
            </button>

            <a href="confimacion_de_vuelo.html" id="cancelBtn"
              class="inline-flex justify-center rounded-lg border border-slate-300 px-6 py-3 text-sm font-semibold text-text-dark bg-white hover:bg-slate-50 transition-colors duration-200">
              Cancelar
            </a>
          </div>
        </div>
      </div>
    </div>

    <script src="./js/añadir_pasajeros.js"></script>
  </body>
  </html>
